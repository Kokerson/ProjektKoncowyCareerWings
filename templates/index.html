<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Czat AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="container">
    <nav class="main-nav"><a href="/czat" class="nav-link">Czat</a> <a href="/analiza-strona" class="nav-link">Analiza
        CSV</a> <a href="/streszczenie-strona" class="nav-link">Streszczanie</a> <a href="/wyloguj"
                                                                                    class="nav-link logout-link">Wyloguj</a>
    </nav>
    <h1>Czat z Ekspertem</h1>
    <form action="/zapytaj" method="POST"><textarea name="pytanie" rows="4"></textarea>
        <button type="submit">Wyślij</button>
    </form>
    {% if odpowiedz %}
    <div class="answer-box"><p>{{ odpowiedz }}</p></div>
    {% endif %}
</main>
</body>
</html>
